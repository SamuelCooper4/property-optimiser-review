<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">Outside the home, you still have choices.</title><desc id="desc">Retained money is not automatically invested; cash and investments have different roles. Illustrative B: £20,000.00 cash reserve plus £40,000.00 initially invested. Investments can lose value; cash is an alternative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><rect x="365" y="60" width="230" height="104" rx="4" fill="#F6F2E9" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><path d="M365 60 L480.0 103 L595 60" stroke="#233C34" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="480.0" y="140" font-size="27" fill="#262A28" font-weight="600" text-anchor="middle">£60,000.00</text><text x="480.0" y="199" font-size="23" fill="#262A28" font-weight="400" text-anchor="middle">Retained on day one</text><path d="M480 230V275H260V305 M480 275H700V305" stroke="#9C4D33" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="315" width="340" height="155" rx="0" fill="#D7DFCF" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><text x="115" y="355" font-size="26" fill="#262A28" font-weight="400" text-anchor="start">Keep in cash</text><text x="115" y="400" font-size="32" fill="#262A28" font-weight="600" text-anchor="start">£20,000.00</text><text x="115" y="440" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">Illustrative reserve</text><rect x="530" y="315" width="340" height="155" rx="0" fill="#F6F2E9" stroke="#9C4D33" stroke-width="2" stroke-dasharray=""/><text x="555" y="355" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">Invest — or keep in cash</text><text x="555" y="400" font-size="32" fill="#9C4D33" font-weight="600" text-anchor="start">£40,000.00</text><text x="555" y="440" font-size="24" fill="#9C4D33" font-weight="400" text-anchor="start">Can lose value</text></g></svg>