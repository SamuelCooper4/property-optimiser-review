<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">Reverse it. Keep more at the start.</title><desc id="desc">The smaller deposit’s advantage is more money available immediately outside the home. Example B returns to £40,000.00 deposit; £360,000.00 mortgage; £60,000.00 retained.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><path d="M43 145 L185.0 80 L327 145" stroke="#233C34" stroke-width="4" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="145" width="260" height="250" rx="0" fill="#233C34" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="55" y="370.0" width="260" height="25.0" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="185.0" y="197" font-size="22" fill="#F6F2E9" font-weight="400" text-anchor="middle">Mortgage</text><text x="185.0" y="231" font-size="28" fill="#F6F2E9" font-weight="600" text-anchor="middle">£360,000.00</text><path d="M323 370.0 h22 v30 h14" stroke="#9C4D33" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="315" cy="370.0" r="15" fill="#F6F2E9" stroke="#9C4D33" stroke-width="3"/><path d="M310 366.0 h10 M310 374.0 h10" stroke="#9C4D33" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="55" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">The same £400,000.00 home</text><text x="55" y="450" font-size="27" fill="#9C4D33" font-weight="600" text-anchor="start">Deposit £40,000.00</text><rect x="140" y="505" width="230" height="104" rx="4" fill="#F6F2E9" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><path d="M140 505 L255.0 548 L370 505" stroke="#233C34" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="585" font-size="27" fill="#262A28" font-weight="600" text-anchor="middle">£60,000.00</text><text x="255.0" y="644" font-size="23" fill="#262A28" font-weight="400" text-anchor="middle">Money outside</text><path d="M75 383 C25 420 30 545 120 545" stroke="#9C4D33" stroke-width="4" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="30" y="710" font-size="24" fill="#9C4D33" font-weight="400" text-anchor="start">£40,000.00 moves back</text></g></svg>