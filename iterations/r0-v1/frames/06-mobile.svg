<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">Sometimes you cross a pricing threshold.</title><desc id="desc">A better mortgage rate is conditional on reaching a deal band, not on every extra pound. Fictional 80% band example only; no lender offer or numeric rate. 80% means mortgage as a share of the home price. Actual bands may differ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><text x="40" y="110" font-size="30" fill="#262A28" font-weight="400" text-anchor="start">How much of the home</text><text x="40" y="148" font-size="30" fill="#262A28" font-weight="400" text-anchor="start">is paid for by the mortgage?</text><path d="M40 310 H440" stroke="#233C34" stroke-width="5" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 300 V320" stroke="#233C34" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="355" font-size="26" fill="#262A28" font-weight="400" text-anchor="middle">90%</text><path d="M240.0 300 V320" stroke="#233C34" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240.0" y="355" font-size="26" fill="#262A28" font-weight="400" text-anchor="middle">80%</text><path d="M440 300 V320" stroke="#233C34" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="355" font-size="26" fill="#262A28" font-weight="400" text-anchor="middle">70%</text><path d="M240.0 235 V390" stroke="#9C4D33" stroke-width="3" stroke-dasharray="5 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240.0" cy="310" r="12" fill="#DF795B"/><path d="M70 278 H220.0" stroke="#9C4D33" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130.0" y="415" width="220" height="48" rx="24" fill="#233C34" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="240.0" y="447" font-size="23" fill="#F6F2E9" font-weight="500" text-anchor="middle">A different rate band</text><text x="40" y="535" font-size="25" fill="#9C4D33" font-weight="400" text-anchor="start">Fictional 80% boundary</text><text x="40" y="575" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">A rate may improve at the step.</text></g></svg>