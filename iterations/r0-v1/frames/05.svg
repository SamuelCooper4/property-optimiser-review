<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">Less debt to charge interest on.</title><desc id="desc">Borrowing less can reduce interest costs with the rate and repayment term held fixed. Conceptual comparison over the same repayment term. Trail lengths are schematic, not amounts. Interest is never part of the house price.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><path d="M68 180 L220.0 115 L372 180" stroke="#233C34" stroke-width="4" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="180" width="280" height="220" rx="0" fill="#233C34" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="80" y="356.0" width="280" height="44.0" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="220.0" y="232" font-size="22" fill="#F6F2E9" font-weight="400" text-anchor="middle">Mortgage</text><text x="220.0" y="266" font-size="28" fill="#F6F2E9" font-weight="600" text-anchor="middle">£320,000.00</text><path d="M368 356.0 h22 v30 h14" stroke="#9C4D33" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 250H475V290H540" stroke="#233C34" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="545" y="175" font-size="26" fill="#262A28" font-weight="400" text-anchor="start">Same rate. Same term.</text><rect x="545" y="250" width="340" height="45" rx="0" fill="none" stroke="#233C34" stroke-width="2" stroke-dasharray="7 7"/><rect x="545" y="340" width="244.79999999999998" height="45" rx="0" fill="#233C34" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="545" y="233" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">Interest cost: before</text><text x="545" y="415" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">Interest cost: after</text><text x="35" y="545" font-size="22" fill="#9C4D33" font-weight="400" text-anchor="start">Interest cost over the term · schematic</text></g></svg>