<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">Put more in. Borrow less.</title><desc id="desc">The extra deposit replaces borrowing pound for pound. Example A: £80,000.00 deposit; £320,000.00 mortgage; £20,000.00 retained.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><path d="M98 160 L255.0 95 L412 160" stroke="#233C34" stroke-width="4" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="160" width="290" height="250" rx="0" fill="#233C34" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="110" y="360.0" width="290" height="50.0" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="255.0" y="212" font-size="22" fill="#F6F2E9" font-weight="400" text-anchor="middle">Mortgage</text><text x="255.0" y="246" font-size="28" fill="#F6F2E9" font-weight="600" text-anchor="middle">£320,000.00</text><path d="M110 385.0 H400" stroke="#F6F2E9" stroke-width="2" stroke-dasharray="6 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M408 360.0 h22 v30 h14" stroke="#9C4D33" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400" cy="360.0" r="15" fill="#F6F2E9" stroke="#9C4D33" stroke-width="3"/><path d="M395 356.0 h10 M395 364.0 h10" stroke="#9C4D33" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="70" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">The same £400,000.00 home</text><text x="110" y="465" font-size="27" fill="#9C4D33" font-weight="600" text-anchor="start">Deposit £80,000.00</text><rect x="650" y="245" width="230" height="104" rx="4" fill="#F6F2E9" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><path d="M650 245 L765.0 288 L880 245" stroke="#233C34" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="765.0" y="325" font-size="27" fill="#262A28" font-weight="600" text-anchor="middle">£20,000.00</text><text x="765.0" y="384" font-size="23" fill="#262A28" font-weight="400" text-anchor="middle">Money outside</text><path d="M630 335 C540 440 500 410 420 390" stroke="#9C4D33" stroke-width="4" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="540" y="480" font-size="24" fill="#9C4D33" font-weight="400" text-anchor="start">£40,000.00 moves in</text></g></svg>