<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">Now follow the monthly payment.</title><desc id="desc">Less borrowing, and possibly a lower rate, can reduce the required repayment for the same term. Conceptual monthly payment; no quoted repayment, no amount or scaled comparison. Same repayment term assumed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><text x="35" y="90" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">The payment leaves each month.</text><path d="M45 165 l34 -26 l34 26 v45 h-68z" stroke="#233C34" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M113 185 H210 V268" stroke="#233C34" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="290" width="360.8" height="82" rx="0" fill="none" stroke="#233C34" stroke-width="2" stroke-dasharray="7 6"/><rect x="35" y="290" width="250.1" height="82" rx="0" fill="#233C34" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="55" y="340" font-size="28" fill="#F6F2E9" font-weight="400" text-anchor="start">Payment</text><path d="M390.8 405 H295.1" stroke="#9C4D33" stroke-width="4" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="35" y="465" font-size="25" fill="#262A28" font-weight="400" text-anchor="start">Less needed for the mortgage</text><text x="35" y="736" font-size="22" fill="#9C4D33" font-weight="400" text-anchor="start">Conceptual monthly flow · not to scale</text></g></svg>