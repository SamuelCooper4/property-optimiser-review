<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">Some of your savings become your deposit.</title><desc id="desc">The deposit comes out of the same savings you already have. Target deposit £40,000.00. No extra money is created during transfer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><path d="M43 145 L185.0 80 L327 145" stroke="#233C34" stroke-width="4" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="145" width="260" height="250" rx="0" fill="#D7DFCF" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><rect x="55" y="370" width="260" height="25" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="140" y="505" width="230" height="104" rx="4" fill="#F6F2E9" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><path d="M140 505 L255.0 548 L370 505" stroke="#233C34" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="585" font-size="27" fill="#262A28" font-weight="600" text-anchor="middle">Savings</text><text x="255.0" y="644" font-size="23" fill="#262A28" font-weight="400" text-anchor="middle">From your savings</text><path d="M140 557 C20 557 18 383 55 383" stroke="#DF795B" stroke-width="24" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="450" font-size="27" fill="#9C4D33" font-weight="600" text-anchor="start">Deposit £40,000.00</text><text x="35" y="725" font-size="24" fill="#9C4D33" font-weight="400" text-anchor="start">A transfer, not a second pot.</text></g></svg>