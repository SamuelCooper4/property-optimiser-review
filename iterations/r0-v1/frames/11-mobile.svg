<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">A head start, or more added each month?</title><desc id="desc">A smaller deposit can create a larger initial investment; a larger deposit may enable larger monthly additions. A: £80,000.00 deposit, £20,000.00 cash, £0.00 initial investment. B: £40,000.00 deposit, £20,000.00 cash, £40,000.00 initial investment. Monthly tab sizes are conceptual, not scaled financial outputs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><text x="35" y="100" font-size="29" fill="#233C34" font-weight="600" text-anchor="start">A · Larger deposit</text><text x="35" y="137" font-size="23" fill="#262A28" font-weight="400" text-anchor="start">Cash reserve £20,000.00</text><rect x="35" y="165" width="190" height="90" rx="0" fill="#F6F2E9" stroke="#9C4D33" stroke-width="2" stroke-dasharray=""/><text x="130" y="201" font-size="22" fill="#262A28" font-weight="400" text-anchor="middle">Initial investment</text><text x="130" y="237" font-size="25" fill="#9C4D33" font-weight="600" text-anchor="middle">£0.00</text><rect x="255" y="205" width="42" height="40" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="309" y="205" width="42" height="40" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="363" y="205" width="42" height="40" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><path d="M35 275 H445" stroke="#233C34" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="245" y="310" font-size="22" fill="#262A28" font-weight="400" text-anchor="start">Invested each month</text><text x="255" y="183" font-size="22" fill="#262A28" font-weight="400" text-anchor="start">More monthly</text><text x="35" y="400" font-size="29" fill="#233C34" font-weight="600" text-anchor="start">B · Smaller deposit</text><text x="35" y="437" font-size="23" fill="#262A28" font-weight="400" text-anchor="start">Cash reserve £20,000.00</text><rect x="35" y="465" width="190" height="90" rx="0" fill="#F6F2E9" stroke="#9C4D33" stroke-width="2" stroke-dasharray=""/><text x="130" y="501" font-size="22" fill="#262A28" font-weight="400" text-anchor="middle">Initial investment</text><text x="130" y="537" font-size="25" fill="#9C4D33" font-weight="600" text-anchor="middle">£40,000.00</text><rect x="255" y="505" width="32" height="20" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="309" y="505" width="32" height="20" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="363" y="505" width="32" height="20" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><path d="M35 575 H445" stroke="#233C34" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="245" y="610" font-size="22" fill="#262A28" font-weight="400" text-anchor="start">Invested each month</text><text x="255" y="483" font-size="22" fill="#262A28" font-weight="400" text-anchor="start">Less monthly</text><text x="35" y="730" font-size="22" fill="#9C4D33" font-weight="400" text-anchor="start">Balances are boxes. Additions are tabs.</text></g></svg>