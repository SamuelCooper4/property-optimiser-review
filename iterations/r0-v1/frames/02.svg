<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">Some of your savings become your deposit.</title><desc id="desc">The deposit comes out of the same savings you already have. Target deposit £40,000.00. No extra money is created during transfer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><path d="M98 160 L255.0 95 L412 160" stroke="#233C34" stroke-width="4" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="160" width="290" height="250" rx="0" fill="#D7DFCF" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><rect x="110" y="385" width="290" height="25" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="650" y="245" width="230" height="104" rx="4" fill="#F6F2E9" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><path d="M650 245 L765.0 288 L880 245" stroke="#233C34" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="765.0" y="325" font-size="27" fill="#262A28" font-weight="600" text-anchor="middle">Savings</text><text x="765.0" y="384" font-size="23" fill="#262A28" font-weight="400" text-anchor="middle">From your savings</text><path d="M650 315 C530 315 540 398 400 398" stroke="#DF795B" stroke-width="24" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="465" font-size="27" fill="#9C4D33" font-weight="600" text-anchor="start">Deposit £40,000.00</text><text x="35" y="535" font-size="24" fill="#9C4D33" font-weight="400" text-anchor="start">A transfer, not a second pot.</text></g></svg>