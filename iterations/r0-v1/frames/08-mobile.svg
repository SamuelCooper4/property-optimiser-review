<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">The same monthly budget has room left.</title><desc id="desc">A lower payment leaves more of a fixed mortgage-and-saving budget available for saving. Conceptual successor behaviour, unavailable from the current engine. No numeric budget, contribution or investment outcome is claimed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><text x="35" y="90" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">The payment leaves each month.</text><path d="M35 275 v-22 H445 v22" stroke="#233C34" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="232" font-size="28" fill="#262A28" font-weight="600" text-anchor="start">Same monthly budget</text><rect x="35" y="290" width="250.1" height="82" rx="0" fill="#233C34" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="285.1" y="290" width="159.9" height="82" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="51" y="340" font-size="26" fill="#F6F2E9" font-weight="400" text-anchor="start">Payment</text><text x="299.1" y="340" font-size="26" fill="#262A28" font-weight="600" text-anchor="start">Left</text><path d="M363.0 383 v70" stroke="#9C4D33" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="35" y="475" font-size="26" fill="#9C4D33" font-weight="400" text-anchor="start">Available to save or invest</text><rect x="35" y="500" width="58" height="26" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="35" y="557" font-size="22" fill="#262A28" font-weight="400" text-anchor="start">M1</text><rect x="125" y="500" width="58" height="26" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="125" y="557" font-size="22" fill="#262A28" font-weight="400" text-anchor="start">M2</text><rect x="215" y="500" width="58" height="26" rx="0" fill="#DF795B" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="215" y="557" font-size="22" fill="#262A28" font-weight="400" text-anchor="start">M3</text><text x="35" y="736" font-size="22" fill="#9C4D33" font-weight="400" text-anchor="start">Conceptual monthly flow · not to scale</text></g></svg>