<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">Outside the home, you still have choices.</title><desc id="desc">Retained money is not automatically invested; cash and investments have different roles. Illustrative B: £20,000.00 cash reserve plus £40,000.00 initially invested. Investments can lose value; cash is an alternative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9C4D33"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9C4D33" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#F6F2E9"/><g font-family="Arial, sans-serif"><rect x="125" y="75" width="230" height="104" rx="4" fill="#F6F2E9" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><path d="M125 75 L240.0 118 L355 75" stroke="#233C34" stroke-width="2" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240.0" y="155" font-size="27" fill="#262A28" font-weight="600" text-anchor="middle">£60,000.00</text><text x="240.0" y="214" font-size="23" fill="#262A28" font-weight="400" text-anchor="middle">Retained on day one</text><path d="M240 235V280H90V315 M240 280H355V505" stroke="#9C4D33" stroke-width="3" stroke-dasharray="" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="325" width="410" height="115" rx="0" fill="#D7DFCF" stroke="#233C34" stroke-width="2" stroke-dasharray=""/><text x="55" y="365" font-size="26" fill="#262A28" font-weight="600" text-anchor="start">Keep £20,000.00 in cash</text><text x="55" y="408" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">Illustrative reserve</text><rect x="35" y="515" width="410" height="150" rx="0" fill="#F6F2E9" stroke="#9C4D33" stroke-width="2" stroke-dasharray=""/><text x="55" y="558" font-size="28" fill="#9C4D33" font-weight="600" text-anchor="start">Invest £40,000.00</text><text x="55" y="604" font-size="24" fill="#262A28" font-weight="400" text-anchor="start">Or keep this in cash too.</text><text x="55" y="642" font-size="23" fill="#9C4D33" font-weight="400" text-anchor="start">Investments can lose value.</text></g></svg>